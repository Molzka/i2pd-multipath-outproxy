services:
    i2pd:
        image: myi2pd:latest
        container_name: myi2pd
        network_mode: host
        user: i2pd
        restart: always
        ulimits:
          nofile:
            soft: 1655350
            hard: 1655350
        volumes:
            - ./data:/home/i2pd/data:z
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
