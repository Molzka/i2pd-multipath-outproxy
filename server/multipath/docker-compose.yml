services:
    multipath:
        image: mymultipath:latest
        container_name: mymultipath
        network_mode: host
        restart: always
        #  --tcp-link-filter none
        command: /multipath/agg-tunnel --cfg /multipath/multipath.cfg server --tcp 1337 -p 1080 -n
        ulimits:
          nofile:
            soft: 655350
            hard: 655350
        volumes:
            - ./multipath.cfg:/multipath/multipath.cfg:ro
        read_only: true
        cap_drop:
            - ALL
        security_opt:
          - no-new-privileges:true


    sing-box:
        image: gzxhwq/sing-box:server
        restart: always
        network_mode: host
        volumes:
          - ./sing-box-config.json:/etc/sing-box/config.json
        cap_add:
          - NET_ADMIN
        devices:
          - /dev/net/tun
        ulimits:
          nofile:
            soft: 655350
            hard: 655350